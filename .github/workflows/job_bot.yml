name: Govt Job Bot

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ALLOWS PUSHING TO REPO

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history for better git stability

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_jobs.py

      - name: Push Database Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Force the file to exist and add it
          touch seen_jobs.txt
          git add seen_jobs.txt
          
          # Check if there are changes to commit
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Update job history [skip ci]"
            git push origin HEAD
            echo "✅ Changes pushed to GitHub."
          else
            echo "ℹ️ No new jobs found to save."
          fi
