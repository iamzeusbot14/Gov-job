name: Omni Govt Job Bot

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours
  workflow_dispatch:      # Allows manual testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_jobs.py

      - name: Sync Database to Repo
        run: |
          # --- UPDATED BOT IDENTITY ---
          git config --local user.email "zeusbot@atomicmail.io"
          git config --local user.name "Z E U S B O T"
          
          # Pull latest to prevent conflicts
          git pull origin main --rebase
          
          # Ensure file is tracked
          touch seen_jobs.txt
          git add seen_jobs.txt
          
          if git diff --staged --quiet; then
            echo "No new jobs to save."
          else
            git commit -m "Update job database [skip ci]"
            git push origin main
          fi
