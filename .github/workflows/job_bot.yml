name: Govt Job Bot

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows you to run it manually from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required to push the seen_jobs.txt update back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_jobs.py

      - name: Commit and Push changes
        run: |
          # 1. Configure Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 2. Ensure the file exists so 'git add' doesn't fail
          touch seen_jobs.txt 
          
          # 3. Stage the file
          git add seen_jobs.txt
          
          # 4. Only commit and push if the file was actually changed
          if git diff --staged --quiet; then
            echo "No new jobs to save. Skipping commit."
          else
            git commit -m "Update seen jobs list [skip ci]"
            git push
          fi
